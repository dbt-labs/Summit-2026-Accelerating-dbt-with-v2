models:
  - name: fct_store_daily
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - store_id
              - order_date
      - dbt_utils.expression_is_true:
          name: avg_order_total_is_reasonable
          arguments:
            expression: "avg_order_total >= 0 and avg_order_total <= daily_order_total"
      - dbt_utils.expression_is_true:
          name: daily_order_total_matches_subtotal_plus_tax
          arguments:
            expression: "abs(daily_order_total - (daily_subtotal + daily_tax_paid)) < 0.01"
      - dbt_utils.expression_is_true:
          name: days_since_store_open_is_nonnegative
          arguments:
            expression: "days_since_store_open >= 0"
    columns:
      - name: store_id
        data_tests:
          - not_null
      - name: order_date
        data_tests:
          - not_null
