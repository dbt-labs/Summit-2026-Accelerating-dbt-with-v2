version: 2

models:
  - name: fct_store_daily
    description: >
      Daily store-level performance mart. One row per store per day with order
      counts, revenue rollups, average order value, and store age context.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - store_id
              - order_date
      # daily_order_total should reconcile with subtotal + tax
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(daily_order_total - (daily_subtotal + daily_tax_paid)) < 0.01"
      # avg_order_total should equal daily_order_total / orders_count
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(avg_order_total - (daily_order_total / orders_count)) < 0.01"
    columns:
      - name: store_id
        description: Store identifier. Part of the daily grain.
        data_tests:
          - not_null
      - name: order_date
        description: Day grain (date_trunc of ordered_at). Part of the daily grain.
        data_tests:
          - not_null
      - name: orders_count
        description: Number of orders for the store on the day.
        data_tests:
          - not_null
      - name: daily_order_total
        description: Sum of order_total for the store on the day.
        data_tests:
          - not_null
      - name: avg_order_total
        description: daily_order_total / orders_count.
        data_tests:
          - not_null
      - name: days_since_store_open
        description: Days between store open date and order_date. Never negative.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
