models:
  - name: fct_store_daily
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - store_id
              - order_date
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coalesce(days_since_store_open >= 0, false)"
