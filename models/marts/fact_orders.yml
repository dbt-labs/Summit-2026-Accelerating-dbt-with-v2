version: 2

models:
  - name: fact_orders
    description: Order-level fact table with customer, store, and item rollup attributes.
    columns:
      - name: order_id
        description: Unique identifier for the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: store_id
        description: Store where the order was placed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__stores')
                field: store_id
      - name: order_date
        description: Day the order was placed.
        data_tests:
          - not_null
      - name: subtotal
        description: Order subtotal before tax.
        data_tests:
          - not_null
      - name: tax_paid
        description: Tax paid on the order.
        data_tests:
          - not_null
      - name: order_total
        description: Total order amount including tax.
        data_tests:
          - not_null
      - name: store_location
        description: Store location for the order.
      - name: tax_rate
        description: Tax rate for the store.
      - name: items_count
        description: Count of order items on the order.
        data_tests:
          - not_null
      - name: distinct_products_count
        description: Count of distinct products on the order.
        data_tests:
          - not_null
      - name: expected_tax
        description: Expected tax derived from subtotal and store tax rate.
      - name: tax_delta
        description: Difference between paid tax and expected tax.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_total = subtotal + tax_paid"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "items_count >= distinct_products_count"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "items_count > 0"
