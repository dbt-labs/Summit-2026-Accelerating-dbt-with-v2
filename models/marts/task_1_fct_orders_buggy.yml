models:
  - name: task_1_fct_orders_buggy
    description: One row per order with dollar-denominated totals, store tax context, and item-level rollups.
    columns:
      - name: order_id
        description: The unique identifier for the order and grain of this model.
        data_tests:
          - unique
          - not_null
      - name: tax_rate
        description: The tax rate associated with the store where the order was placed.
        data_tests:
          - not_null
      - name: items_count
        description: The number of order-item rows associated with the order; null when an order has no matching item rows.
      - name: distinct_products_count
        description: The number of distinct products associated with the order; null when an order has no matching item rows.
      - name: expected_tax
        description: The expected tax calculated as subtotal multiplied by the store tax rate.
        data_tests:
          - not_null
      - name: tax_delta
        description: The difference between tax paid and expected tax.
        data_tests:
          - not_null
