models:
  - name: stg_jaffle_shop__orders
    description: "{{ doc('stg_jaffle_shop__orders') }}"
    config:
      materialized: table
      state:
        lag_tolerance: 2m
    columns:
      - name: order_id
        description: "{{ doc('stg_jaffle_shop__order_id') }}"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "{{ doc('stg_jaffle_shop__customer_id') }}"
        data_tests:
          - not_null
      - name: store_id
        description: "{{ doc('stg_jaffle_shop__store_id') }}"
        data_tests:
          - not_null
      - name: subtotal_cents
        data_tests:
          - not_null
      - name: tax_paid_cents
        data_tests:
          - not_null
      - name: order_total_cents
        data_tests:
          - not_null
      - name: subtotal
        data_tests:
          - not_null
      - name: tax_paid
        data_tests:
          - not_null
      - name: order_total
        data_tests:
          - not_null
      - name: ordered_at
        data_tests:
          - not_null
